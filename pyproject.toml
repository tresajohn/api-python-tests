[project]
name = "restful-booker-py"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "pytest>=8.0.0",
    "allure-pytest>=2.13.5",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
